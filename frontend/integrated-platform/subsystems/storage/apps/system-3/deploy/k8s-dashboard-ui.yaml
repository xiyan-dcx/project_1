apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-ui
  namespace: scalaafa-platform
  labels:
    app.kubernetes.io/name: scalaafa-dashboard-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: scalaafa-dashboard-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scalaafa-dashboard-ui
    spec:
      nodeSelector:
        kubernetes.io/hostname: master
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ui
          image: scalaafa/dashboard-ui:v4
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /system-3/
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /system-3/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-ui
  namespace: scalaafa-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: scalaafa-dashboard-ui
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30083
