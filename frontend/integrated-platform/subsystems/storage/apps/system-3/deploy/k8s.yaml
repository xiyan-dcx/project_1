apiVersion: v1
kind: ConfigMap
metadata:
  name: system-3-config
data:
  ENGINE_TARGET: "10.166.33.158"
  BENCH_DRIVER: "ssh"
  VM_USER: "femu"
  VM_PORT: "8090"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-3-api
  labels: { app: system-3-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: system-3-api }
  template:
    metadata:
      labels: { app: system-3-api }
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/system-3-api:latest
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: system-3-config } }]
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: system-3-api
spec:
  selector: { app: system-3-api }
  ports:
    - name: http
      port: 8000
      targetPort: http
