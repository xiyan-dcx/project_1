# 由总平台 nginx 配置 include。本模块只提供前缀路由，不修改 portal。
location /system-3/api/ {
    proxy_pass http://system-3-api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location /system-3/ws {
    proxy_pass http://system-3-api:8000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
location /system-3/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /system-3/index.html;
}
