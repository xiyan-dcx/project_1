# 调度展示页。把本文件 include 到门户 server 块内部。
# 依赖 http 层的 engine.upstream.conf，先生成：pnpm nginx:upstream

# 前端静态资源
location /scheduler/ {
    alias /var/www/scheduler-display/;
    try_files $uri $uri/ /scheduler/index.html;
}

# 调度引擎接口，含 SSE 长连接
location /api/k8s/ {
    proxy_pass http://scheduler_engine;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    # SSE 必须关闭缓冲，否则事件会卡在 nginx 里推不到浏览器
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no;
}
